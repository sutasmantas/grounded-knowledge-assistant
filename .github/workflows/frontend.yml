name: Frontend

# The UI2 shell talks to the real API, so its checks need the Python project
# installed as well as the Node toolchain. Nothing in this suite is mocked.

on:
  push:
    paths:
      - "frontend/**"
      - "app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the Atlas API
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Workflow, responsive and accessibility checks
        env:
          # The workflow's own interpreter already has the project installed.
          ATLAS_PYTHON: python
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
