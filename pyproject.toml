[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-knowledge"
version = "2.0.0"
description = "A grounded company knowledge assistant with document ingestion, vector retrieval and source citations."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mantas Sutas" }]
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.12,<3",
  "pypdf>=6.6.2,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.15,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  # psutil is imported by the embedding benchmark module that the test suite
  # collects, so the default CI install must provide it.
  "psutil>=7.2,<8",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
parsing-benchmark = [
  "docling[rapidocr]>=2.117,<3",
  "unstructured[pdf]>=0.24,<1",
  "unstructured-inference>=1.6,<2",
]
embedding-benchmark = [
  "psutil>=7.2,<8",
  "sentence-transformers>=5.6,<6",
]
semantic-eval = [
  "torch>=2.13,<3",
  "transformers>=4.57,<5",
]
security-scan = [
  "garak>=0.15,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
